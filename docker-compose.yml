services:
  postgres:
    # pgvector build of PG17 — the note_chunks migration runs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: joice
      POSTGRES_PASSWORD: joice
      POSTGRES_DB: joice
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U joice -d joice']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. Both services wait for it to succeed, which is how two
  # services sharing one database avoid racing each other's migrations — the
  # same reason production runs this as a one-off ECS task before deploying.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    command: ['bun', 'packages/db/src/migrate.ts']
    environment:
      DATABASE_URL: postgresql://joice:joice@postgres:5432/joice
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://joice:joice@postgres:5432/joice
      PORT: 4000
      # Both dev origins: the dev server binds 0.0.0.0, so the site is reachable
      # (and occasionally linked) via either host.
      WEB_ORIGIN: http://localhost:3000,http://0.0.0.0:3000
      IP_HASH_SALT: change-me-in-production
      # 0 locally (no proxy in front); production sets 2 for CloudFront + ALB.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      NODE_ENV: production
      # Clerk (admin auth) — set real dev keys in .env
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_placeholder}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder}
      # Klaviyo waitlist sync — both empty disables it (signups just don't sync).
      KLAVIYO_API_KEY: ${KLAVIYO_API_KEY:-}
      KLAVIYO_LIST_ID: ${KLAVIYO_LIST_ID:-}
      # The admin console edits the brain's settings, so it needs the same
      # model/voice defaults the brain resolves against.
      RAG_MODEL: ${RAG_MODEL:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      POLLY_VOICE_ID: ${POLLY_VOICE_ID:-Ruth}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The brain: chat, voice, and the notes it answers from. Separate service so
  # it can scale and evolve on its own — see docs/rag/10-architecture.md.
  brain:
    build:
      context: .
      dockerfile: apps/brain/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://joice:joice@postgres:5432/joice
      PORT: 4100
      WEB_ORIGIN: http://localhost:3000,http://0.0.0.0:3000
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      NODE_ENV: production
      # Bedrock/Transcribe/Polly — needs AWS creds to answer for real; without
      # them these endpoints fail and the rest of the site still works.
      RAG_MODEL: ${RAG_MODEL:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      POLLY_VOICE_ID: ${POLLY_VOICE_ID:-Ruth}
      # Chat-thread persistence. Off by default — storing member questions
      # crosses the Phase-0 compliance line; see apps/brain/src/env.ts.
      BRAIN_PERSIST_CONVERSATIONS: ${BRAIN_PERSIST_CONVERSATIONS:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - '4100:4100'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser-reachable URLs (published host ports), inlined at build time.
        NEXT_PUBLIC_API_URL: http://localhost:4000
        # Locally the two services are on different ports. In production this is
        # left empty: CloudFront serves one origin and the ALB routes
        # /api/brain/* to the brain service.
        NEXT_PUBLIC_BRAIN_URL: http://localhost:4100
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Clerk (admin auth) — set real dev keys in .env
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # Server components reach the API service directly inside the compose network.
      API_URL_INTERNAL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api
      - brain

volumes:
  postgres_data:
