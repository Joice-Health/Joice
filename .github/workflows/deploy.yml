name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC federation to AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_API_URL is intentionally the empty string: CloudFront serves
      # web and api from one origin, so the browser calls a relative /api/... path.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_URL=${{ vars.CLOUDFRONT_URL }}
          tags: |
            ${{ vars.ECR_WEB }}:latest
            ${{ vars.ECR_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: release
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.ECR_API }}:latest
            ${{ vars.ECR_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Deploy services
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE_API }}" --force-new-deployment >/dev/null
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE_WEB }}" --force-new-deployment >/dev/null
          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE_API }}" "${{ vars.ECS_SERVICE_WEB }}"
          echo "✅ Deployed ${{ github.sha }}"
