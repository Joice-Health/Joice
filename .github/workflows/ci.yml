name: CI

# Also callable from deploy.yml, which gates the build on it — a red check
# must not be able to reach production.
on:
  pull_request:
  workflow_call:

# Superseded PR runs are worth cancelling; a run that deploy.yml is waiting on
# is not — cancelling it would fail the deploy that called it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      # Turbo caches per task, so these are cheap on an unchanged package.
      # They run even if an earlier one fails: one push should report every
      # problem, not just the first.
      - name: Type check
        run: bun run type-check

      - name: Lint
        if: '!cancelled()'
        run: bun run lint

      - name: Test
        if: '!cancelled()'
        run: bun run test
