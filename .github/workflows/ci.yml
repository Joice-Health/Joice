name: CI

# Also callable from deploy.yml, which gates the deploy on it: a red check must
# not be able to reach production.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Superseded PR runs are worth cancelling; a run that deploy.yml is waiting on
# is not, since cancelling it would fail the deploy that called it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Two seconds on a cold runner; a cache step would cost more than it saves.
      - run: bun install --frozen-lockfile

      # Turborepo's task cache, carried between runs through the Actions cache.
      # Keys are per commit; the prefix restore pulls the newest earlier entry
      # (on main, the previous deploy's), so packages whose inputs did not change
      # replay their type-check, lint and test results instead of re-running.
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # One turbo run for all three tasks. --continue keeps going past a failure
      # so one push reports every problem, and the exit code is still non-zero
      # if any task failed.
      - name: Type-check, lint, test
        run: bun run check

      # Saved with always() so a red lint does not throw away the green
      # type-check entries produced in the same run.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
